name: Claude Code Review

on:
  workflow_call:
    inputs:
      model:
        required: false
        type: string
        default: "claude-opus-5-5"
        description: "Model passed to --model"
      effort:
        required: false
        type: string
        default: "medium"
        description: "Reasoning effort passed to --effort"
      plugin_marketplaces:
        required: false
        type: string
        default: "https://github.com/anthropics/claude-plugins-official.git"
        description: "Plugin marketplace(s) to install"
      plugins:
        required: false
        type: string
        default: "code-review@claude-plugins-official"
        description: "Plugin(s) to load, e.g. code-review@claude-plugins-official"
      pr_number:
        required: false
        type: string
        default: ""
        description: "PR to review when the triggering event carries none (workflow_dispatch)"
      prompt:
        required: false
        type: string
        default: ""
        description: "Override the review prompt / slash command (defaults to the PR code-review command)"
      allowed_tools:
        required: false
        type: string
        default: "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
        description: "Comma-separated allow-list passed to --allowedTools"

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  claude-review:
    # A review runs when a ready PR opens, when a draft is marked ready, on
    # workflow_dispatch, and when someone with write access comments
    # "@claude review" on the PR.
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 1

      - name: Build review prompt
        id: prompt
        env:
          PROMPT_OVERRIDE: ${{ inputs.prompt }}
          REPO: ${{ github.repository }}
          RE_REVIEW: ${{ github.event_name == 'issue_comment' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PROMPT_OVERRIDE" ]; then
            prompt="$PROMPT_OVERRIDE"
          else
            prompt="/code-review:code-review --comment $REPO/pull/$PR_NUMBER

          Treat every AGENTS.md file as a CLAUDE.md file."
            if [ "$RE_REVIEW" = "true" ]; then
              prompt="$prompt

          This is a re-review requested in a PR comment. In step 1, ignore the condition that Claude has already commented on this PR. Do not post an issue that one of these existing review comments already raises:

          $(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/comments" --jq '.[] | "- \(.path):\(.line // .original_line): \(.body | split("\n")[0])"')"
            fi
          fi
          {
            echo 'value<<PROMPT_EOF'
            echo "$prompt"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # The review command starts its agents in the background and ends its turn, and the
          # action exits there, so nothing is ever posted. This makes it wait for them.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_federation_rule_id: fdrl_01VojL1HiyuiXKPhwpGBog5y
          anthropic_organization_id: 419a8109-6266-4a41-ac47-2219ed0042dc
          anthropic_workspace_id: wrkspc_01J2dp4tyQTNiLkevGeZxKHw
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          plugins: ${{ inputs.plugins }}
          prompt: ${{ steps.prompt.outputs.value }}
          show_full_output: true
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --allowedTools "${{ inputs.allowed_tools }}"
