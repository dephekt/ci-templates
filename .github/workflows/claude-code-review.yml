name: Claude Code Review

on:
  workflow_call:
    inputs:
      model:
        required: false
        type: string
        default: "claude-opus-4-8[1m]"
        description: "Model passed to --model"
      effort:
        required: false
        type: string
        default: "xhigh"
        description: "Reasoning effort passed to --effort"
      plugin_marketplaces:
        required: false
        type: string
        default: "https://github.com/anthropics/claude-code.git"
        description: "Plugin marketplace(s) to install"
      plugins:
        required: false
        type: string
        default: "code-review@claude-code-plugins"
        description: "Plugin(s) to load, e.g. code-review@claude-code-plugins"
      prompt:
        required: false
        type: string
        default: ""
        description: "Override the review prompt / slash command (defaults to the PR code-review command)"
      allowed_tools:
        required: false
        type: string
        default: "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
        description: "Comma-separated allow-list passed to --allowedTools"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          plugins: ${{ inputs.plugins }}
          prompt: ${{ inputs.prompt != '' && inputs.prompt || format('/code-review:code-review {0}/pull/{1}', github.repository, github.event.pull_request.number) }}
          track_progress: true
          claude_args: |
            --model ${{ inputs.model }}
            --effort ${{ inputs.effort }}
            --allowedTools "${{ inputs.allowed_tools }}"
